name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'expense-manager/**'
      # Documentation and store-listing copy cannot change the built site, so
      # they must not spend a deploy. `!` negation is evaluated in order, so
      # these subtract from the include above.
      - '!expense-manager/**/*.md'
      - '!expense-manager/docs/**'
      - '!expense-manager/playstore/**'
      - '!expense-manager/.maestro/**'
      - '!expense-manager/android-templates/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: expense-manager

jobs:
  build:
    runs-on: ubuntu-latest
    # ~4x the observed runtime. Without this the job inherits GitHub's
    # 360-minute default, so one wedged build costs 18% of the monthly quota.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expense-manager/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: expense-manager/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
