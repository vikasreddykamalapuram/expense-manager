name: E2E Maestro Flows

# Runs Maestro end-to-end flows against a debug APK on an ephemeral
# Android emulator. Triggered on PRs that touch the app or the flows,
# and manually via the Actions tab.
#
# Screenshots + Maestro logs are uploaded as artifacts so failures can be
# triaged without needing a local Android setup.

on:
  pull_request:
    branches: [master]
    # `labeled` is essential: the default types are opened/synchronize/reopened,
    # so without it adding the run-e2e label would do nothing until the next push.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'expense-manager/src/**'
      - 'expense-manager/.maestro/**'
      - 'expense-manager/android-templates/**'
      - 'expense-manager/scripts/patch-android-manifest.mjs'
      - 'expense-manager/capacitor.config.ts'
      - '.github/workflows/e2e-maestro.yml'
  workflow_dispatch:
    inputs:
      flow_filter:
        description: 'Optional Maestro flow filter (e.g. 01-smoke.yaml)'
        required: false
        default: ''

# Booting an Android emulator twice for the same branch is pure waste; only the
# newest run can still be relevant.
concurrency:
  group: e2e-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    # No longer on every pull request.
    #
    # This job builds a debug APK and boots an emulator — by far the longest in
    # the repo — while being non-blocking, so the most expensive signal here was
    # also the one nobody had to read. Once this repository is private that is
    # billed time as well.
    #
    # It now runs only when asked for, and is BLOCKING when it does:
    #   - add the `run-e2e` label to a pull request, or
    #   - Actions -> E2E Maestro Flows -> Run workflow
    #
    # Day-to-day the higher-fidelity check is the local runner
    # (`npm run test:e2e:local`), which drives a real emulator on real hardware
    # instead of a software-rendered one. Put its result in the PR description.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expense-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # KVM must be enabled for the Android emulator to boot on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: expense-manager/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:capacitor
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android
          node scripts/patch-android-manifest.mjs
          node scripts/patch-android-build.mjs

      - name: Build debug APK
        working-directory: expense-manager/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Gradle & AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-33-pixel-6

      - name: Determine Maestro flow target
        run: |
          FLOW_FILTER="${{ github.event.inputs.flow_filter }}"
          if [ -n "$FLOW_FILTER" ]; then
            echo "MAESTRO_TARGET=.maestro/flows/$FLOW_FILTER" >> "$GITHUB_ENV"
          else
            echo "MAESTRO_TARGET=.maestro/flows" >> "$GITHUB_ENV"
          fi

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: expense-manager
          script: |
            adb wait-for-device
            adb shell input keyevent 82 || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb logcat -v time > "$GITHUB_WORKSPACE/adb-logcat.txt" 2>&1 &
            LOGCAT_PID=$!
            maestro test "$MAESTRO_TARGET" --format=junit --output=maestro-report.xml || echo "MAESTRO_FAILED=1" >> "$GITHUB_ENV"
            sleep 2
            kill $LOGCAT_PID 2>/dev/null || true

      # Only keep diagnostics when there is something to diagnose. Uploading a
      # logcat and a screenshot set on every green run fills the repository's
      # artifact quota, and a full quota makes artifact upload fail — which
      # marks otherwise-passing jobs as failed and blocks merges.
      - name: Upload adb logcat
        if: ${{ failure() || env.MAESTRO_FAILED == '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: adb-logcat-${{ github.sha }}
          path: adb-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Maestro artifacts
        if: ${{ failure() || env.MAESTRO_FAILED == '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-${{ github.sha }}
          path: |
            expense-manager/maestro-report.xml
            ~/.maestro/tests/**/screenshots/**
            ~/.maestro/tests/**/*.log
          if-no-files-found: warn
          retention-days: 7

      # Blocking, on purpose.
      #
      # This used to emit a ::warning:: and exit 0, so the run went green with
      # the failure buried in the log. A job that cannot fail the run is a job
      # nobody reads — and the same pattern on the web side of the sibling
      # project let two real bugs ship past a green check.
      #
      # Now that the job only runs when explicitly requested, enforcing its
      # result costs nothing: if you asked for E2E, you wanted the answer.
      - name: Fail if any Maestro flow failed
        if: env.MAESTRO_FAILED == '1'
        run: |
          echo "::error::One or more Maestro flows failed. See the uploaded artifacts (maestro-artifacts + adb-logcat)."
          exit 1
