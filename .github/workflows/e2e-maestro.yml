name: E2E Maestro Flows

# Runs Maestro end-to-end flows against a debug APK on an ephemeral
# Android emulator. Triggered on PRs that touch the app or the flows,
# and manually via the Actions tab.
#
# Screenshots + Maestro logs are uploaded as artifacts so failures can be
# triaged without needing a local Android setup.

on:
  pull_request:
    branches: [master]
    paths:
      - 'expense-manager/src/**'
      - 'expense-manager/.maestro/**'
      - 'expense-manager/android-templates/**'
      - 'expense-manager/scripts/patch-android-manifest.mjs'
      - 'expense-manager/capacitor.config.ts'
      - '.github/workflows/e2e-maestro.yml'
  workflow_dispatch:
    inputs:
      flow_filter:
        description: 'Optional Maestro flow filter (e.g. 01-smoke.yaml)'
        required: false
        default: ''

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expense-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # KVM must be enabled for the Android emulator to boot on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: expense-manager/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:capacitor
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android
          node scripts/patch-android-manifest.mjs
          node scripts/patch-android-build.mjs

      - name: Build debug APK
        working-directory: expense-manager/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Gradle & AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-33-pixel-6

      - name: Determine Maestro flow target
        run: |
          FLOW_FILTER="${{ github.event.inputs.flow_filter }}"
          if [ -n "$FLOW_FILTER" ]; then
            echo "MAESTRO_TARGET=.maestro/flows/$FLOW_FILTER" >> "$GITHUB_ENV"
          else
            echo "MAESTRO_TARGET=.maestro/flows" >> "$GITHUB_ENV"
          fi

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: expense-manager
          script: |
            adb wait-for-device
            adb shell input keyevent 82 || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb logcat -v time > "$GITHUB_WORKSPACE/adb-logcat.txt" 2>&1 &
            LOGCAT_PID=$!
            maestro test "$MAESTRO_TARGET" --format=junit --output=maestro-report.xml || echo "MAESTRO_FAILED=1" >> "$GITHUB_ENV"
            sleep 2
            kill $LOGCAT_PID 2>/dev/null || true

      - name: Upload adb logcat on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adb-logcat-${{ github.sha }}
          path: adb-logcat.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-${{ github.sha }}
          path: |
            expense-manager/maestro-report.xml
            ~/.maestro/tests/**/screenshots/**
            ~/.maestro/tests/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report Maestro result (non-blocking)
        if: env.MAESTRO_FAILED == '1'
        run: |
          echo "::warning::One or more Maestro flows failed. See uploaded artifacts (maestro-artifacts + adb-logcat)."
          echo ""
          echo "Note: Maestro E2E is currently non-blocking while we tune the CI emulator setup."
          echo "The app is validated on real devices via the debug APK from android-debug workflow."
          echo "Track: https://github.com/vikasreddykamalapuram/expense-manager/issues (filter: label:ci-flaky)"
