name: Android Release APK+AAB

# Produces a signed release AAB (for Play Store) and APK (for sideload) using
# a keystore stored in GitHub Secrets. Triggered on version tags or manually.
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64       — base64 of your release.keystore file
#   ANDROID_KEYSTORE_PASSWORD     — keystore password
#   ANDROID_KEY_ALIAS             — key alias inside the keystore
#   ANDROID_KEY_PASSWORD          — key password
#
# Generate the keystore locally once (see docs/MAC_SETUP.md), then upload as
# a base64 string:  base64 -i release.keystore | pbcopy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName override (e.g. 3.1.0). Leave blank to use package.json.'
        required: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: expense-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: expense-manager/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor + patch manifest
        run: |
          npx cap sync android
          node scripts/patch-android-manifest.mjs

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Write signing gradle properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Inject signingConfig into build.gradle
        run: node scripts/inject-signing-config.mjs

      - name: Compute version code
        run: |
          # Monotonically increasing versionCode based on run number so each
          # release has a unique upload identity in Play Console.
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build release AAB + APK
        working-directory: expense-manager/android
        env:
          ORG_GRADLE_PROJECT_versionCode: ${{ env.VERSION_CODE }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: expenseiq-release-aab-${{ github.sha }}
          path: expense-manager/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expenseiq-release-apk-${{ github.sha }}
          path: expense-manager/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/release.keystore android/keystore.properties
