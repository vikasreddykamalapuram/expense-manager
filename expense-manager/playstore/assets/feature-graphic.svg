<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-label="MoneyIQ feature graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- subtle decorative circles -->
  <g opacity="0.10" filter="url(#soft)">
    <circle cx="880" cy="90" r="150" fill="#ffffff"/>
    <circle cx="120" cy="440" r="120" fill="#ffffff"/>
  </g>

  <!-- app icon tile -->
  <g transform="translate(96,150)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="100" y="140" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#ffffff" text-anchor="middle">&#8377;</text>
    <g transform="translate(38,150)" fill="#a5b4fc">
      <rect x="0" y="-2" width="14" height="20" rx="3"/>
      <rect x="22" y="-14" width="14" height="32" rx="3"/>
      <rect x="44" y="-30" width="14" height="48" rx="3"/>
      <rect x="66" y="-46" width="14" height="64" rx="3"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <g transform="translate(348,0)">
    <text x="0" y="235" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" fill="#ffffff" letter-spacing="-2">MoneyIQ</text>
    <text x="4" y="300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#e0e7ff">Smart personal finance &#183; private by default</text>
    <text x="4" y="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#c7d2fe">No ads&#160;&#160;&#8226;&#160;&#160;No subscription&#160;&#160;&#8226;&#160;&#160;Works offline</text>
  </g>
</svg>
