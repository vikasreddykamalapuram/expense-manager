<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Signing you in… — ExpenseIQ</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #eef2ff 0%, #ffffff 50%, #eef2ff 100%); color: #1f2937; }
  main { text-align: center; max-width: 360px; padding: 24px; }
  .spinner { width: 44px; height: 44px; border: 3px solid #c7d2fe; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  p { font-size: 14px; margin: 0 0 12px; color: #6b7280; }
  a { color: #4f46e5; text-decoration: none; font-weight: 500; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <h1 id="msg">Signing you in…</h1>
  <p id="sub">Returning to ExpenseIQ.</p>
  <p id="fallback" style="display:none;"><a id="deepLink" href="#">Tap here to return to ExpenseIQ</a></p>
</main>
<script>
  (function () {
    var hash = window.location.hash || '';
    var search = window.location.search || '';
    var payload = hash.length > 1 ? hash : (search.length > 1 ? '#' + search.slice(1) : '');
    var deepLink = 'expenseiq://oauth/callback' + payload;

    var linkEl = document.getElementById('deepLink');
    if (linkEl) linkEl.setAttribute('href', deepLink);

    try { window.location.replace(deepLink); } catch (e) { /* manual fallback below */ }

    setTimeout(function () {
      var fb = document.getElementById('fallback');
      var msg = document.getElementById('msg');
      var sub = document.getElementById('sub');
      if (fb) fb.style.display = 'block';
      if (msg) msg.textContent = 'Almost done';
      if (sub) sub.textContent = 'If ExpenseIQ didn\u2019t open automatically:';
    }, 1500);
  })();
</script>
</body>
</html>
