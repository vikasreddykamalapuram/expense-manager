<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExpenseIQ · Signing in…</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, #fff 100%);
      color: #1f2937;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(180deg, #111827 0%, #0f172a 100%); color: #e5e7eb; }
      .card { background: #1f2937; }
    }
    .card {
      background: #fff;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 360px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    p { margin: 0; font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Signing you in…</h1>
    <p>Returning to ExpenseIQ. If this page doesn't close automatically, please open ExpenseIQ manually.</p>
  </div>
  <script>
    // The provider sent tokens back in the URL fragment. Immediately deep-link
    // them into the ExpenseIQ app via its custom scheme — the AndroidManifest
    // intent-filter for expenseiq:// hands control to MainActivity, and the
    // Capacitor App plugin's appUrlOpen listener extracts + validates the token.
    (function () {
      var fragment = window.location.hash || '';
      var target = 'expenseiq://oauth/callback' + fragment;
      // Use replace so the browser tab history doesn't retain the callback URL.
      window.location.replace(target);
    })();
  </script>
</body>
</html>
